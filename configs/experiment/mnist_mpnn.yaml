# @package _global_
# MNIST recurrent-MPNN baseline (graph-level mean-pool readout).
task: mnist
model_type: mpnn

training:
  lr: 1.0e-3
  weight_decay: 1.0e-7
  epochs: 20
  mpnn_train_rounds: 20
  mpnn_eval_rounds: 50
  val_interval: 5

data:
  dir: datasets/mnist
  train_split: train
  val_splits: [test]
  loader: image

task_cfg:
  patch_size: 3
  stride: 3
  connectivity: 8
  num_classes: 10

model:
  num_classes: 10
  d_v: 32
  d_e: 24
  encoder_arch: mlp
  enc_hidden_dim: 256
  comm_norm_type: layernorm
  decoder_arch: classification
  dec_hidden_dims: [128]
  mpnn_message_dim: 24
  mpnn_aggregation: mean
  mpnn_edge_type_mode: spatial
  num_directions: 8
  mpnn_graph_readout: graph
